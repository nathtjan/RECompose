name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rid: win-x64
            cmake-args: ""
          - name: macOS
            os: macos-latest
            rid: osx-arm64
            cmake-args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
          - name: Linux (tests only)
            os: ubuntu-24.04
            rid: linux-x64
            cmake-args: -G Ninja

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      REC_REQUIRE_NATIVE: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libfreetype-dev libfontconfig-dev ninja-build

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Configure engine
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }} 2>&1 | tee ci-logs/1-configure.txt

      - name: Build engine
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake --build build/engine --config Release --parallel 2>&1 | tee ci-logs/2-build-engine.txt

      - name: Test engine
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ctest --test-dir build/engine -C Release --output-on-failure 2>&1 | tee ci-logs/3-test-engine.txt

      - name: Stage engine
        run: cmake --install build/engine --config Release --component engine --prefix artifacts/native

      - name: Build app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          dotnet build RECompose.slnx -c Release 2>&1 | tee ci-logs/4-build-app.txt

      - name: Test app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          dotnet test --solution RECompose.slnx -c Release --no-build --results-directory TestResults --report-xunit-trx 2>&1 | tee ci-logs/5-test-app.txt

      - name: Report failures
        if: failure()
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" tools/ci/report-test-failures.py TestResults ci-logs

      - name: Publish app
        if: runner.os != 'Linux'
        run: dotnet publish src/RECompose.App/RECompose.App.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}

      - name: Upload app
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: RECompose-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          retention-days: 14
